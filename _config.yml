# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Jpawitro's Space
name: Joko Pawitro
occupation: 'Engineer | Geek | Analyst'
email: jpawitro@protonmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Joko Pawitro's personal page.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

occupations:
  - company : Ørsted
    description: Ørsted A/S (formerly DONG Energy) is a Danish multinational power company based in Fredericia, Denmark. It is the largest energy company in Denmark and the world's largest developer of offshore wind power by number of built offshore wind farms.
    url: https://orsted.com
    social:
      linkedin: orsted
      twitter: Orsted
      instagram: orsted
      youtube: '@Orsted'
    logo: assets/images/Orsted.png
    image: assets/images/orsted_banner.png
    role: Cable Specialist, Export Cable Systems
    scope: >-
      Full lifecycle engineering for export cable systems — integrating
      electrical, thermal, mechanical, and subsea data for design validation,
      operational decisions, and end-of-life assessment.
    projects:
      - "Cable exposure detection & monitoring: integrating DTS/DAS with subsea survey data for early intervention"
      - "TEEM (Thermal-Electrical Equivalent Model): verifying supplier thermal calculations and design assumptions"
      - "RBCD (Risk-Based Cable Design): ongoing simulation for design validation"
      - "Dynamic Line Rating (DLR) methodology — also the focus of my Master's thesis"
    capabilities:
      - HV cable systems (export, array, onshore, offshore)
      - Thermal-electrical modeling (IEC 60287, CIGRE TB 880/908)
      - Cable condition monitoring (DTS/DAS)
      - Risk-based cable design (Monte Carlo methods)
      - Remaining life assessment & end-of-life decisions
    stack:
      - Python (NumPy, Pandas, Matplotlib, Scikit-learn)
      - MATLAB, Mathcad, CYMCAP
      - pandapower, PyPSA
      - IEC 60287 / CIGRE TB 880 & TB 908, DNV standards

social:
  github:  jpawitro
  linkedin: jpawitro
  medium:

